name: Deploy combat tester to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - apps/combat-solo-tester/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use GitHub Actions as the Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload combat tester
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/combat-solo-tester

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
